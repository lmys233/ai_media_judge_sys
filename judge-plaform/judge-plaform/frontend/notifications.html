<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>审核通知</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e2ef;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 14px 0; font-size: 22px; }
    .desc { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .pill {
      display: inline-block; border: 1px solid var(--line); border-radius: 999px;
      padding: 2px 10px; font-size: 12px; color: #334155; background: #f8fafc;
    }
    .label-normal { background: #dcfce7; color: #166534; }
    .label-abuse { background: #fef3c7; color: #92400e; }
    .label-violence { background: #fee2e2; color: #991b1b; }
    .label-porn { background: #f3e8ff; color: #6b21a8; }
    .label-politics { background: #fef9c3; color: #854d0e; }
    .label-other { background: #f3f4f6; color: #374151; }

    .case-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: box-shadow 0.15s;
    }
    .case-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .case-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .case-id { font-size: 13px; color: var(--muted); }
    .case-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .case-content {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      word-break: break-all;
      max-height: 80px;
      overflow: hidden;
    }
    .case-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .case-reason {
      font-size: 13px;
      color: #374151;
      margin-top: 6px;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 6px;
    }
    .evidence-list {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .evidence-item {
      display: inline-block;
      background: #f3f4f6;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .refresh-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .refresh-btn:hover { background: #1d4ed8; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">← 返回审核提交</a>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1>审核通知</h1>
        <div class="desc" id="caseCount">加载中...</div>
      </div>
      <button class="refresh-btn" onclick="loadUnviewedCases()">刷新</button>
    </div>
  </div>

  <div id="caseList">
    <div class="loading">正在加载...</div>
  </div>
</div>

<script>
  async function loadUnviewedCases() {
    const listEl = document.getElementById('caseList');
    listEl.innerHTML = '<div class="loading">正在加载...</div>';

    try {
      // Fetch unviewed cases - this API will mark them as viewed
      const resp = await fetch('/judge/unviewed');
      const data = await resp.json();

      if (data.code !== 200 || !data.data) {
        listEl.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>加载失败: ' + (data.message || '未知错误') + '</div></div>';
        return;
      }

      const cases = data.data;
      document.getElementById('caseCount').textContent = '共 ' + cases.length + ' 条未读审核通知';

      if (cases.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><div class="icon">✅</div><div>暂无未读审核通知</div></div>';
        return;
      }

      listEl.innerHTML = cases.map(c => {
        // Parse violation_types from JSON array
        let violationTypes = [];
        try {
          violationTypes = typeof c.violationTypes === 'string' ? JSON.parse(c.violationTypes) : (c.violationTypes || []);
        } catch(e) {}

        // Parse ai_result
        let aiResult = null;
        try {
          aiResult = typeof c.aiResult === 'string' ? JSON.parse(c.aiResult) : (c.aiResult || null);
        } catch(e) {}

        // Parse evidence
        let evidence = [];
        try {
          evidence = typeof c.evidence === 'string' ? JSON.parse(c.evidence) : (c.evidence || []);
        } catch(e) {}

        const finalLabel = aiResult?.final_label || violationTypes[0] || 'normal';
        const confidence = aiResult?.confidence || 0;
        const reason = aiResult?.reason || c.reviewReason || '';

        return `
          <div class="case-item">
            <div class="case-header">
              <span class="case-id">案例 #${c.caseId}</span>
              <span class="case-badge label-${finalLabel}">${finalLabel}</span>
            </div>
            <div class="case-content">${escapeHtml(c.contentText || '(媒体文件)')}</div>
            <div class="case-meta">
              <span>媒体类型: ${c.mediaType}</span>
              <span>置信度: ${(confidence * 100).toFixed(1)}%</span>
              <span>来源: ${c.source}</span>
            </div>
            ${reason ? '<div class="case-reason">审核理由: ' + escapeHtml(reason) + '</div>' : ''}
            ${evidence.length > 0 ? '<div class="evidence-list">证据: ' + evidence.map(e => '<span class="evidence-item">' + escapeHtml(e) + '</span>').join('') + '</div>' : ''}
          </div>
        `;
      }).join('');

    } catch (err) {
      listEl.innerHTML = '<div class="empty-state"><div class="icon">❌</div><div>网络错误: ' + err.message + '</div></div>';
    }
  }

  function escapeHtml(s) {
    if (!s) return '';
    return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
            .replaceAll('"',"&quot;").replaceAll("'","&#39;");
  }

  // Load on page open
  loadUnviewedCases();
</script>
</body>
</html>
